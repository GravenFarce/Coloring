<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo to Coloring Sheet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>
  <main>
    <h1>Photo &rarr; Coloring Sheet</h1>
    <p class="subtitle">Upload a photo and get a printable coloring-book outline.</p>

    <div id="drop-zone" class="drop-zone">
      <p>🖍️ Drag &amp; drop, click to choose, or paste (Ctrl+V) a photo</p>
      <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp">
    </div>

    <p id="error-message" class="error-message" hidden></p>
    <p id="status-message" class="status-message" hidden>Processing&hellip;</p>
    <p id="success-message" class="success-message" hidden></p>

    <section id="coloring-sheet-section" hidden>
      <h2 class="section-heading">Coloring Sheet</h2>

      <div id="preview-area" class="preview-area">
        <div class="preview-panel">
          <h2>Original</h2>
          <canvas id="original-canvas"></canvas>
        </div>
        <div class="preview-panel">
          <h2>Coloring Sheet</h2>
          <canvas id="output-canvas"></canvas>
        </div>
      </div>

      <div id="tuning-controls" class="tuning-controls">
        <label for="detail-slider">Detail Level: <span id="detail-value">210</span></label>
        <input type="range" id="detail-slider" min="100" max="300" step="10" value="210">

        <label for="sensitivity-slider">Dark-Area Sensitivity: <span id="sensitivity-value">3</span></label>
        <input type="range" id="sensitivity-slider" min="1" max="6" step="0.5" value="3">
      </div>

      <div class="button-row">
        <button id="download-button">Download Coloring Sheet</button>
        <button id="print-button">Print Coloring Sheet</button>
        <button id="email-button">Email Original Photo</button>
        <button id="reset-button">Reset to Defaults</button>
      </div>
    </section>

    <section id="dots-section" hidden>
      <h2 class="section-heading">Connect the Dots</h2>

      <canvas id="dots-canvas"></canvas>

      <div id="dots-controls" class="tuning-controls">
        <label for="outline-tightness-slider">Outline Tightness: <span id="outline-tightness-value">100</span></label>
        <input type="range" id="outline-tightness-slider" min="40" max="150" step="10" value="100">

        <label for="dot-count-slider">Number of Dots: <span id="dot-count-value">50</span></label>
        <input type="range" id="dot-count-slider" min="20" max="100" step="5" value="50">
      </div>

      <div class="button-row">
        <button id="download-dots-button">Download Connect-the-Dots</button>
        <button id="reset-dots-button">Reset to Defaults</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
