<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo to Coloring Sheet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>
  <main>
    <h1>Photo &rarr; Coloring Sheet</h1>
    <p class="subtitle">Upload a photo and get a printable coloring-book outline.</p>

    <div id="drop-zone" class="drop-zone">
      <p>🖍️ Drag &amp; drop, click to choose, or paste (Ctrl+V) a photo</p>
      <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp">
    </div>

    <p id="error-message" class="error-message" hidden></p>
    <p id="status-message" class="status-message" hidden>Processing&hellip;</p>
    <p id="success-message" class="success-message" hidden></p>

    <div id="preview-area" class="preview-area" hidden>
      <div class="preview-panel">
        <h2>Original</h2>
        <canvas id="original-canvas"></canvas>
      </div>
      <div class="preview-panel">
        <h2>Coloring Sheet</h2>
        <canvas id="output-canvas"></canvas>
      </div>
    </div>

    <div id="tuning-controls" class="tuning-controls" hidden>
      <label for="detail-slider">Detail Level: <span id="detail-value">210</span></label>
      <input type="range" id="detail-slider" min="100" max="300" step="10" value="210">

      <label for="sensitivity-slider">Dark-Area Sensitivity: <span id="sensitivity-value">3</span></label>
      <input type="range" id="sensitivity-slider" min="1" max="6" step="0.5" value="3">

      <button id="reset-button">Reset to Defaults</button>
    </div>

    <button id="download-button" hidden>Download Coloring Sheet</button>
    <button id="print-button" hidden>Print Coloring Sheet</button>
    <button id="email-button" hidden>Email Original Photo</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
